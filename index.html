<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faltas UFRJ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f9fd;--card:#fbfdff;--text:#12232a;--muted:#6b7b82;--line:#d9e3ea;--pri:#1f7a89;--onpri:#fff;--soft:#e3eef4;--accent:#a8ecfc;--onacc:#00363f;--ok:#2f7d5b;--warn:#b86e00;--warnbg:#fdf0d8;--bad:#b3261e;--badbg:#fbe3e1;--okbg:#dff0e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{padding:20px 14px 4px}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:0 6px}
header h1{margin:0;font-size:30px;font-weight:700}
header p{margin:4px 0 0;font-size:17px;color:var(--muted)}
.ic{display:flex;gap:18px;padding-top:6px}.ic svg{width:26px;height:26px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.days{display:flex;gap:6px;padding-top:16px}
.dp{flex:1;border:0;background:var(--card);border-radius:20px;padding:14px 0;font:inherit;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text);cursor:pointer}
.dp small{font-size:15px;font-weight:600}.dp b{font-size:22px}.dp.we{color:var(--muted)}
.dp[aria-pressed="true"]{background:var(--pri);color:#fff}
.grid{position:relative;margin:8px 0 0 48px}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hl span{position:absolute;left:-46px;top:-8px;font-size:12px;font-weight:600;color:var(--muted)}
.ev{position:absolute;left:8px;right:2px;border-radius:14px;padding:10px 12px 10px 20px;overflow:hidden;font-size:13px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ev b{display:block;font-size:17px;line-height:1.2}.ev small{display:block;opacity:.92;line-height:1.4;margin-top:2px;font-weight:600}.ev .fb span{color:#fff!important}
.ubtn{display:flex;align-items:center;gap:10px;border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer;text-align:left;flex:1;min-width:0}
.ucard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;margin:10px 0 0}
.none{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:80%;text-align:center;margin:0;font-weight:600;font-size:17px;padding:22px 14px}
.row .pill{margin-left:auto}
.kb{border:0;background:none;color:var(--text);font-size:22px;line-height:1;padding:2px 6px;cursor:pointer;border-radius:8px}
.menu{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.mi{width:100%;text-align:left;border:0;background:none;color:var(--bad);font:inherit;font-weight:700;padding:10px;cursor:pointer}
.sw{display:flex;gap:10px;flex-wrap:wrap}.swb{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.swb[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 2px var(--bg)}
.fb{position:absolute;bottom:8px;right:10px;display:flex;align-items:center;gap:4px;font-weight:800}
#gst{padding:12px 6px 0}#gst:empty{display:none}
.stk{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px 5px 8px;font-weight:700;font-size:14px}
#mm{position:fixed;inset:0;background:rgba(10,30,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}#mm.on{display:flex}
.sheet{width:100%;max-width:430px;max-height:94%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.bar2{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;min-height:64px;padding:2px 4px 14px}
.bar2 .l{display:flex;align-items:center;gap:12px}.bar2 .r{display:flex;justify-content:flex-end}
.brand{font-size:22px;font-weight:800;color:#1a4a85;letter-spacing:.3px;white-space:nowrap;text-align:center}
.sk{display:flex;align-items:center;gap:3px;font-weight:800;font-size:17px}
.ib{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:none;color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
.ib.pl{background:none;color:var(--text)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot::after{content:"";position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.hero{background:#2f80ed;color:#fff;border-radius:28px;margin:2px 4px 20px;box-shadow:0 9px 0 #1d56a8;overflow:hidden}
.hmain{display:flex;align-items:stretch}
.htx{flex:1;min-width:0;padding:18px 20px 16px}
.htx small{display:block;font-size:14px;font-weight:800;color:#bcdcff}
.htx h1{margin:2px 0 0;font-size:24px;font-weight:700;color:#fff;line-height:1.15}
.hero .days{padding:16px 12px 20px;border-top:2px solid #1f64c4}
.ib.qr{width:50px;height:50px;border-radius:16px;background:var(--accent);color:var(--onacc)}
.pf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}.pf h2{margin:6px 0 0;font-size:24px}
.avb{position:relative;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.av{border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--text)}
.cam{position:absolute;right:-2px;bottom:2px;width:32px;height:32px;border-radius:50%;background:#2f80ed;border:3px solid var(--bg);display:grid;place-items:center}
.cam svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linejoin:round}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;color:var(--text);cursor:pointer}
.opt b{display:block}.opt span{font-size:13px;color:var(--muted)}.opt[aria-checked="true"]{border-color:#2f80ed;background:#e7f1fe}
.mi.n{color:var(--text)}
textarea{width:100%;font:inherit;font-size:16px;border:0;background:none;color:var(--text);resize:none;outline:none;padding:4px 0}
.post{display:flex;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line)}
.pav{width:42px;height:42px;border-radius:50%;background:#1a4a85;color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.pb{flex:1;min-width:0}.ph1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ptxt{margin-top:4px;font-size:15px;line-height:1.4;word-break:break-word}
.pim{display:grid;gap:3px;border-radius:16px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.pim.n1{grid-template-columns:1fr}.pim.n2,.pim.n3,.pim.n4{grid-template-columns:1fr 1fr}
.pim img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:1/1}.pim.n1 img{aspect-ratio:16/10}
.pact{display:flex;gap:26px;margin-top:10px;color:var(--muted);font-size:13px;align-items:center}
.pact>span,.pact button{display:flex;align-items:center;gap:6px;border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer}
.pact svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pact .lk.on{color:#e0245e}.pact .lk.on svg{fill:#e0245e}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.th span{position:relative}.th img{width:72px;height:72px;object-fit:cover;border-radius:10px;display:block}
.th button{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:11px;cursor:pointer}
#hd{position:relative;z-index:5}
.bar2 .r{gap:8px}
.ib.wa{color:var(--text)}
.pop{position:absolute;right:14px;top:66px;width:min(330px,calc(100% - 28px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 10px 24px rgba(10,30,60,.25)}
.pop>b:first-child{display:block;margin-bottom:4px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}


.hero .dp{background:rgba(255,255,255,.18);color:#fff;padding:14px 0 12px;gap:8px;border-radius:16px;box-shadow:0 4px 0 #1d56a8;transition:transform .08s}.hero .dp.we{color:rgba(255,255,255,.75)}.hero .dp b{font-size:25px}
.si{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px}.si b{font-size:26px}.si svg{width:30px;height:30px}
.fst{display:flex;gap:20px;margin:12px 0 12px 2px}.chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px}
.fcrit{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:14px;padding:10px 12px}
.ib:disabled{opacity:.55;cursor:default}
.hero .dp:active{transform:translateY(3px);box-shadow:none}
.hero .dp[aria-pressed="true"]{background:#fff;color:#1d56a8;box-shadow:0 3px 0 #9ec5f7}
.tb{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 10px}.tl{display:flex;align-items:center;gap:10px}.tb h1{margin:0;font-size:28px;font-weight:700}
.ib img{width:28px;height:28px;display:block}.si img{width:30px;height:30px}
.dcard{position:relative;display:flex;align-items:center;gap:10px;width:100%;border-radius:18px;padding:14px 12px 14px 22px;margin-bottom:12px;color:#fff;cursor:pointer;text-align:left;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.dn{font-size:18px;font-weight:800;min-width:0;flex:1}
.dl{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.22);border-radius:14px;padding:6px 12px;min-width:80px;flex:none}.dl b{font-size:26px;line-height:1.1}.dl small{font-size:11px;font-weight:700;opacity:.92}
.sdet{color:#fff;border-radius:20px;padding:18px;box-shadow:0 5px 0 rgba(0,0,0,.22)}.sdet h2{margin:0 0 6px;font-size:24px}
.sr{margin-top:12px}.sr small{display:block;font-size:12px;font-weight:700;opacity:.85}.sr b{font-size:16px;font-weight:700}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cdh{font-size:12px;font-weight:700;color:var(--muted)}
.cd{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font:inherit;font-weight:700;font-size:14px;border:2px solid transparent;background:none;color:var(--text);padding:0}
button.cd{cursor:pointer}.cd.p{background:#2f9e6a;color:#fff}.cd.a{background:#e0443a;color:#fff}.cd.u{border:2px dashed var(--muted)}.cd.f{border:2px solid var(--line)}.cd.t{box-shadow:0 0 0 2px var(--pri)}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}.leg span{display:flex;align-items:center;gap:6px}.leg i{width:12px;height:12px;border-radius:50%;display:inline-block}.lp{background:#2f9e6a}.la{background:#e0443a}.lu{border:2px dashed var(--muted)}
.bar2 .ib{width:52px;height:52px}.bar2 .ib svg{width:32px;height:32px}.bar2 .ib img{width:36px;height:36px}
.stp{position:absolute;left:0;top:0;bottom:0;width:9px;border-right:2px solid rgba(255,255,255,.55)}
.stp.ok{background:#2f9e6a}.stp.warn{background:#f2c200}.stp.bad{background:#e0443a}.stp.dead{background:#111}
.pill.dead{background:#222;color:#fff}
.fcb{display:flex;flex-direction:column;gap:6px;flex:none}
.fb2{border:0;border-radius:10px;background:rgba(255,255,255,.25);color:#fff;font:inherit;font-size:12px;font-weight:800;padding:6px 8px;cursor:pointer;white-space:nowrap}
.swt{width:52px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.swt i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.swt[aria-checked="true"]{background:#2f80ed}.swt[aria-checked="true"] i{left:25px}
:root[data-theme="dark"]{--bg:#0d1a22;--card:#15262f;--text:#e8f1f5;--muted:#93a6af;--line:#26404d;--pri:#4fc3d6;--onpri:#06222a;--soft:#1e3744;--accent:#1f5f70;--onacc:#d9f7ff;--ok:#6fcf9f;--warn:#f0b24a;--warnbg:#3a2c10;--bad:#ff8a80;--badbg:#401a18;--okbg:#14332a;color-scheme:dark}
:root[data-theme="dark"] .brand{color:#8fc1ff}
:root[data-theme="dark"] .oi{filter:invert(1)}
:root[data-theme="dark"] .opt[aria-checked="true"]{background:#173247}
#fab{position:absolute;right:18px;bottom:92px;width:60px;height:60px;border-radius:18px;border:0;background:var(--accent);color:var(--onacc);font-size:32px;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,54,63,.25)}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-weight:700;font-size:16px}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.bar{height:9px;border-radius:9px;background:var(--soft);margin:12px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.warn .bar i{background:var(--warn)}.bad .bar i{background:var(--bad)}
.pill{font-size:12px;font-weight:700;border-radius:20px;padding:4px 10px;display:inline-block}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.alert{margin-top:10px;font-size:13px;font-weight:600;padding:9px 11px;border-radius:10px}
.warn .alert{background:var(--warnbg);color:var(--warn)}.bad .alert{background:var(--badbg);color:var(--bad)}
.btn{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:var(--pri);color:var(--onpri)}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input,select{width:100%;font:inherit;font-size:15px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
input:focus,select:focus,.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.hor{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:6px;margin-bottom:6px}
.hor .x{width:38px;padding:0}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.err{color:var(--bad);font-size:13px;font-weight:600;margin-top:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;flex:none}
.frow{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px 10px}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;cursor:pointer}
nav button span{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
nav button[aria-current="true"]{color:var(--text)}
nav button[aria-current="true"] span{background:var(--accent);color:var(--onacc)}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--pri);color:var(--onpri);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
</head>
<body>
<div class="app">
  <header id="hd"></header>
  <main id="main"></main>
  <nav>
    <button data-t="painel"><span><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>Grade</button>
    <button data-t="disc"><span><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></span>Disciplinas</button>
    <button data-t="amigos"><span><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/></svg></span>Amigos</button>
    <button data-t="com"><span><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.7A8 8 0 1 1 21 12z"/></svg></span>Comunidade</button>
    <button data-t="perfil"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg></span>Perfil</button>
  </nav>
</div>
<div id="toast" role="status"></div>
<div id="mm"></div>
<input type="file" id="ph" accept="image/*" hidden>

function addFriend(u){var nm=u.replace(/[._]/g," ").replace(/\b\w/g,function(c){return c.toUpperCase()});if(S.friends.some(function(f){return f.n===nm})){toast(nm+" já é seu amigo");return}var o=S.others.filter(function(x){return x.u===u})[0];if(o){S.others.splice(S.others.indexOf(o),1);S.friends.push(o)}else S.friends.push({n:nm,u:u,vis:"friends",streak:0,fr:3,m:[]});if(S.tab==="perfil"||S.tab==="amigos"||S.tab==="user")rkeep();toast(nm+" adicionado aos amigos")}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset,id=b.id;
 if(d.today!==undefined){S.day=2;render()}
 else if(d.fk!==undefined){S.fmenu=S.fmenu===+d.fk?null:+d.fk;rkeep()}
 else if(d.fdel!==undefined){var fi=+d.fdel,fn=S.friends[fi].n,na={};Object.keys(S.alerted).forEach(function(k){k=+k;if(k<fi)na[k]=1;else if(k>fi)na[k-1]=1});S.alerted=na;S.friends.splice(fi,1);S.fmenu=null;rkeep();toast(fn+" removido dos amigos")}
 else if(d.ph){S.pht=d.ph;$("#ph").click()}
 else if(d.vis){S.ed.vis=d.vis;rkeep()}
 else if(id==="e-save"){S.me.name=S.ed.name.trim()||S.me.name;S.me.photo=S.ed.photo;S.me.vis=S.ed.vis;nav("perfil");toast("Perfil atualizado")}
 else if(d.addf!==undefined)openAF();
 else if(d.qr!==undefined)openQR("m");
 else if(d.dev!==undefined){S.dev=!S.dev;S.pop=null;render();toast(S.dev?"Acesso de desenvolvedor ativado":"Acesso de desenvolvedor desativado")}
 else if(d.out!==undefined){S.pop=null;render();toast("Sair da conta (simulado no protótipo)")}
 else if(d.lk!==undefined){var p=S.posts[d.lk];p.liked=!p.liked;p.lk+=p.liked?1:-1;rkeep()}
 else if(d.rmimg!==undefined){S.dr.imgs.splice(d.rmimg,1);rkeep()}
 else if(id==="p-img")$("#pi").click();
 else if(id==="p-ok"){var t=S.dr.t.trim();if(!t&&!S.dr.imgs.length)return;S.posts.unshift({n:"CutPass",u:"cutpass",t:t,imgs:S.dr.imgs,time:"agora",lk:0,liked:false,rp:0,cm:0});S.dr={t:"",imgs:[]};render();toast("Publicado na comunidade")}
});

 if(t.id==="ph"&&t.files[0]){var f=t.files[0];t.value="";readImg(f,400,function(u){if(S.pht==="ed")S.ed.photo=u;else S.me.photo=u;rkeep()})}
 else if(t.id==="pi"){var fs=Array.prototype.slice.call(t.files);t.value="";fs.forEach(function(f){readImg(f,900,function(u){if(S.dr.imgs.length<4){S.dr.imgs.push(u);rkeep()}})})}});

 if(t.id==="p-t"){S.dr.t=t.value;$("#p-ok").disabled=!(t.value.trim()||S.dr.imgs.length)}
 else if(t.id==="e-n")S.ed.name=t.value});

 if(id==="af-s"){var u=$("#af-u").value.trim().replace(/^@/,"");if(!u){$("#af-u").focus();return}closeMap();toast("Convite enviado para @"+u)}

$("#mm").addEventListener("click",function(e){
 var bt=e.target.closest("button"),id=bt?bt.id:"",sv=e.target.closest("#mp-s");
 if(id==="mp-x"||e.target===this)closeMap();
 else if(id==="mp-ok"&&M){S.geo={lat:M.lat,lng:M.lng,label:M.label};closeMap();redraw();toast("Localização da sala salva")}
 else if(id==="mp-f"){var q=nz($("#mp-a").value),p=q?PL.filter(function(x){return nz(x[0]).indexOf(q)>-1})[0]:null;
  if(p)setPin(p[1],p[2],p[0]);else $("#mp-t").textContent="Endereço não encontrado neste protótipo. Escolha um local da lista ou toque no mapa."}
 else if(id==="mp-cur"){$("#mp-t").textContent="Buscando sua localização…";
  var f=function(la,ln,lb){setPin(Math.max(10,Math.min(350,(ln+43.242)/0.024*360)),Math.max(20,Math.min(250,(-22.848-la)/0.02*260)),lb,la,ln)};
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(function(p){f(p.coords.latitude,p.coords.longitude,"Minha localização atual")},function(){f(-22.8603,-43.229,"Ponto de exemplo no campus (GPS indisponível)")},{timeout:6000});
  else f(-22.8603,-43.229,"Ponto de exemplo no campus (GPS indisponível)")}
 else if(sv){var r=sv.getBoundingClientRect();setPin((e.clientX-r.left)/r.width*360,(e.clientY-r.top)/r.height*260,"Ponto no mapa")}
});
